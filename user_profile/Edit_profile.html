<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Edit Profile - Careerforge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#13ec80",
            "background-light": "#f6f8f7",
            "background-dark": "#102219",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="relative flex min-h-screen w-full flex-col group/design-root">
<!-- Top App Bar -->
<div class="sticky top-0 z-10 flex items-center justify-between border-b border-gray-200/50 dark:border-gray-800/50 bg-background-light/80 dark:bg-background-dark/80 p-4 backdrop-blur-sm">
<div class="flex size-10 shrink-0 items-center justify-center">
<span class="material-symbols-outlined text-gray-700 dark:text-gray-300">arrow_back</span>
</div>
<h1 class="flex-1 text-center text-lg font-bold leading-tight tracking-tight text-gray-900 dark:text-white">Edit Profil Saya</h1>
<div class="flex w-10 shrink-0 items-center justify-end"></div>
</div>
<!-- Main Content -->
<main class="w-full max-w-2xl mx-auto px-4 py-6 sm:py-8">
<div class="flex w-full flex-col gap-8">
<!-- Profile Header & Uploader -->
<div class="flex flex-col gap-4 items-center">
<div class="relative group">
<div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full h-32 w-32 ring-4 ring-white dark:ring-gray-800" data-alt="Abstract gradient placeholder for profile picture" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuDTSm8UFT_v9J_YQGL5RCXTA9z_4XZMA5-3v4u8pAkas70XUn488mAEGaVnLnfmU3YhAgtRKuJOq9jRBEDgbgPo_F7nNfEKAe8gMp3LKYYQzyPu7DItNbuNaxI4Shw8FmFpfROPMPfFHOd3q6egqRWhIsr6oOWqEysKiDeld0CCosiupzL4FXyIq_VlyB-SD_OH83gor0RdZoqZo_IRkrP6D4e1-Eb7ZWnwKNy8cO88vOUdntsuPv8ZpC03h67h3cFTz5l8PUYH1OKz");'></div>
<div class="absolute inset-0 bg-black/50 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer">
<span class="material-symbols-outlined text-white text-3xl">photo_camera</span>
</div>
</div>
<div class="flex flex-col items-center justify-center">
<p class="text-gray-900 dark:text-white text-[22px] font-bold leading-tight tracking-tight text-center">Ubah Foto Profil</p>
<p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal text-center">Seret &amp; lepas atau klik untuk unggah</p>
</div>
</div>
<!-- Upload Progress Bar -->
<div class="flex flex-col gap-3">
<div class="flex gap-6 justify-between"><p class="text-gray-900 dark:text-white text-base font-medium leading-normal">Mengunggah...</p><p class="text-gray-500 dark:text-gray-400 text-base font-medium leading-normal">65%</p></div>
<div class="rounded-full bg-primary/20"><div class="h-2 rounded-full bg-primary" style="width: 65%;"></div></div>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-6">
<!-- Text Field: Full Name -->
<label class="flex flex-col">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">Nama Lengkap</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-gray-800/50 h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Masukkan nama lengkap Anda" value="Alexia Doe"/>
</label>
<!-- Text Field: Headline -->
<label class="flex flex-col">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">Headline</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-gray-800/50 h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="cth. Mahasiswa Teknik Informatika" value="Product Designer &amp; Aspiring Developer"/>
</label>
<!-- Text Area: Bio -->
<label class="flex flex-col">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">Bio Singkat</p>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-y overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-gray-800/50 min-h-[120px] placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="Ceritakan sedikit tentang diri Anda...">Mahasiswa tingkat akhir dengan passion di bidang desain produk dan pengembangan antarmuka. Mencari peluang untuk menerapkan keterampilan dalam lingkungan yang kolaboratif.</textarea>
</label>
<!-- Text Field: Location -->
<label class="flex flex-col">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal pb-2">Lokasi</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-gray-800/50 h-14 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-[15px] text-base font-normal leading-normal" placeholder="cth. Jakarta, Indonesia" value="Surabaya, Indonesia"/>
</label>
<!-- Tag Input: Skills -->
<div class="flex flex-col gap-3">
<p class="text-gray-900 dark:text-white text-base font-medium leading-normal">Keterampilan</p>
<div class="flex flex-wrap gap-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-gray-800/50 p-3 min-h-[56px] items-center focus-within:ring-2 focus-within:ring-primary/50">
<!-- Selected Tags -->
<div class="flex items-center gap-1.5 bg-primary/20 text-gray-800 dark:text-gray-100 rounded-full py-1 px-3 text-sm font-medium">
<span>UI/UX Design</span>
<button class="flex items-center justify-center">
<span class="material-symbols-outlined text-base">close</span>
</button>
</div>
<div class="flex items-center gap-1.5 bg-primary/20 text-gray-800 dark:text-gray-100 rounded-full py-1 px-3 text-sm font-medium">
<span>JavaScript</span>
<button class="flex items-center justify-center">
<span class="material-symbols-outlined text-base">close</span>
</button>
</div>
<div class="flex items-center gap-1.5 bg-primary/20 text-gray-800 dark:text-gray-100 rounded-full py-1 px-3 text-sm font-medium">
<span>Figma</span>
<button class="flex items-center justify-center">
<span class="material-symbols-outlined text-base">close</span>
</button>
</div>
<!-- Input field -->
<input class="flex-1 bg-transparent p-1 focus:outline-none min-w-[150px] placeholder:text-gray-400 dark:placeholder:text-gray-500" placeholder="Tambah skill..."/>
</div>
</div>
</div>
<!-- Action Button -->
<div class="pt-4">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-4 bg-primary text-gray-900 text-base font-bold leading-normal tracking-wide hover:opacity-90 transition-opacity">
<span class="truncate">Simpan Perubahan</span>
</button>
</div>
</div>
</main>
</div>
</body></html>
